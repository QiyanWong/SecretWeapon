name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE with PyInstaller
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      # PyQt5 ships its own outdated MSVC runtime (msvcp140.dll etc.). When bundled, it is
      # loaded instead of the system copy and makes torch's c10.dll fail with WinError 1114.
      # Overwrite them with the runner's up-to-date System32 copies before packaging.
      - name: Replace outdated MSVC runtime DLLs bundled with PyQt5
        run: |
          $pyqtDir = python -c "import PyQt5, os; print(os.path.dirname(PyQt5.__file__))"
          Get-ChildItem -Path $pyqtDir -Recurse -Include msvcp140*.dll, vcruntime140*.dll | ForEach-Object {
            $sysDll = Join-Path $env:SystemRoot "System32\$($_.Name)"
            if (Test-Path $sysDll) {
              $oldVer = $_.VersionInfo.FileVersion
              Copy-Item $sysDll $_.FullName -Force
              $newVer = (Get-Item $_.FullName).VersionInfo.FileVersion
              Write-Host "Replaced $($_.FullName): $oldVer -> $newVer"
            }
          }

      - name: Build Portable Directory (Recommended)
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "SecretWeapon-Portable" `
            --collect-all ultralytics `
            --collect-all torch `
            --collect-all torchvision `
            --copy-metadata ultralytics `
            --add-data "dataset;dataset" `
            --add-data "map;map" `
            --add-data "best.pt;." `
            --add-data "yolov8n.pt;." `
            yolo_detector.py

      - name: Compress Portable Directory
        run: |
          Compress-Archive -Path dist/SecretWeapon-Portable -DestinationPath dist/SecretWeapon-Windows-Portable.zip

      # Same as Portable, but with a console window so print() output and tracebacks are visible.
      - name: Build Debug Console Directory
        run: |
          pyinstaller --noconfirm --onedir --console `
            --name "SecretWeapon-Debug" `
            --collect-all ultralytics `
            --collect-all torch `
            --collect-all torchvision `
            --copy-metadata ultralytics `
            --add-data "dataset;dataset" `
            --add-data "map;map" `
            --add-data "best.pt;." `
            --add-data "yolov8n.pt;." `
            yolo_detector.py

      - name: Compress Debug Directory
        run: |
          Compress-Archive -Path dist/SecretWeapon-Debug -DestinationPath dist/SecretWeapon-Windows-Debug.zip

      - name: Build Single File EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "SecretWeapon" `
            --collect-all ultralytics `
            --collect-all torch `
            --collect-all torchvision `
            --copy-metadata ultralytics `
            --add-data "dataset;dataset" `
            --add-data "map;map" `
            --add-data "best.pt;." `
            --add-data "yolov8n.pt;." `
            yolo_detector.py

      - name: Upload Portable Zip Artifact (Recommended)
        uses: actions/upload-artifact@v4
        with:
          name: SecretWeapon-Windows-Portable-Zip
          path: dist/SecretWeapon-Windows-Portable.zip
          retention-days: 30

      - name: Upload Debug Console Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecretWeapon-Windows-Debug-Zip
          path: dist/SecretWeapon-Windows-Debug.zip
          retention-days: 30

      - name: Upload Single File EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecretWeapon-Windows-SingleFile-Exe
          path: dist/SecretWeapon.exe
          retention-days: 30
