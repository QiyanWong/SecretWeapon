name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE with PyInstaller
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Portable Directory (Recommended for PyTorch DLL stability)
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "SecretWeapon-Portable" `
            --collect-all ultralytics `
            --collect-all torch `
            --add-data "dataset;dataset" `
            --add-data "map;map" `
            --add-data "best.pt;." `
            --add-data "yolov8n.pt;." `
            yolo_detector.py

      - name: Compress Portable Directory
        run: |
          Compress-Archive -Path dist/SecretWeapon-Portable -DestinationPath dist/SecretWeapon-Windows-Portable.zip

      - name: Build Single File EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "SecretWeapon" `
            --collect-all ultralytics `
            --collect-all torch `
            --add-data "dataset;dataset" `
            --add-data "map;map" `
            --add-data "best.pt;." `
            --add-data "yolov8n.pt;." `
            yolo_detector.py

      - name: Upload Portable Zip Artifact (Recommended)
        uses: actions/upload-artifact@v4
        with:
          name: SecretWeapon-Windows-Portable-Zip
          path: dist/SecretWeapon-Windows-Portable.zip
          retention-days: 30

      - name: Upload Single File EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecretWeapon-Windows-SingleFile-Exe
          path: dist/SecretWeapon.exe
          retention-days: 30
